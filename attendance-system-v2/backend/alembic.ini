# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = src/app/db/migrations

# template used to render date/time in revision files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d_%%(minute).2d-%%(rev)s_%%(slug)s

# timezone to use when rendering the date
# within the revision file as well as in rendered
# filename.  If specified, this will be passed
# to datetime.datetime.fromtimestamp()
# timezone =

# max length of characters to use in "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc files to be created
# sourceless = false

# version location specification; this defaults
# to src/app/db/migrations/versions.  When using multiple version
# directories, paths must be separated by spaces
# version_locations = %(here)s/bar %(here)s/bat src/app/db/migrations/versions

# the placeholder "sqlalchemy.url" will be filled in by env.py
sqlalchemy.url = postgresql://postgres:postgres@localhost/attendance_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
